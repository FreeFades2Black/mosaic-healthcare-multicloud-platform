name: Mosaic Healthcare Multi-Cloud CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compliance-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Install PyTest & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run Infrastructure & Compliance Tests
        run: |
          python -m pytest tests/ -v
