apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosaic-clinical-ingestion
  namespace: mosaic-healthcare
  labels:
    app.kubernetes.io/name: mosaic-clinical-ingestion
    app.kubernetes.io/part-of: mosaic-healthcare-platform
    compliance: hipaa-hitrust
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mosaic-clinical-ingestion
  template:
    metadata:
      labels:
        app: mosaic-clinical-ingestion
    spec:
      containers:
        - name: ingestion
          image: freefades2black/mosaic-clinical-ingestion:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: ENVIRONMENT
              value: "prod"
            - name: STORAGE_TARGET
              value: "/mnt/bronze"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 10007
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mosaic-clinical-ingestion-svc
  namespace: mosaic-healthcare
spec:
  type: ClusterIP
  selector:
    app: mosaic-clinical-ingestion
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
