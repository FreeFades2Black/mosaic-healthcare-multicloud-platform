# ==================================================================================================
# DOCKER COMPOSE ORCHESTRATOR FOR MOSAIC HEALTHCARE MULTI-CLOUD PLATFORM
# Purpose: Zero-configuration local verification of Terraform IaC, OPA Rego rules, and test suites
# ==================================================================================================

services:
  # ------------------------------------------------------------------------------------------------
  # COMPLIANCE VALIDATOR CONTAINER
  # Runs isolated tests against Terraform configuration and OPA security policies
  # ------------------------------------------------------------------------------------------------
  terraform-compliance-validator:
    build:
      context: .
      dockerfile: Dockerfile
    image: freefades2black/mosaic-healthcare-multicloud-platform:latest
    container_name: mosaic-healthcare-validator
    environment:
      - TF_VAR_environment=prod
    command: ["python", "-m", "pytest", "tests/", "-v"]
